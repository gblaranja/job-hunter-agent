name: job-hunter-agent

# Sem profile: só a infraestrutura, que o Spring Boot sobe sozinho no desenvolvimento (./mvnw spring-boot:run).
# Com --profile app: backend e frontend também, como em produção.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3 compatível para os currículos (o MinIO deixou de publicar imagens).
  object-storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${JOBHUNTER_STORAGE_ACCESS_KEY:-jobhunter}
      RUSTFS_SECRET_KEY: ${JOBHUNTER_STORAGE_SECRET_KEY:-jobhunter-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  backend:
    profiles: [app]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobhunter}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobhunter}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
      JOBHUNTER_USER: ${JOBHUNTER_USER:-}
      JOBHUNTER_PASSWORD_HASH: ${JOBHUNTER_PASSWORD_HASH:-}
      JOBHUNTER_STORAGE_ENDPOINT: http://object-storage:9000
      JOBHUNTER_STORAGE_PUBLIC_ENDPOINT: ${JOBHUNTER_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      JOBHUNTER_STORAGE_ACCESS_KEY: ${JOBHUNTER_STORAGE_ACCESS_KEY:-jobhunter}
      JOBHUNTER_STORAGE_SECRET_KEY: ${JOBHUNTER_STORAGE_SECRET_KEY:-jobhunter-secret}
      JOBHUNTER_STORAGE_BUCKET: ${JOBHUNTER_STORAGE_BUCKET:-jobhunter-resumes}
      JOBHUNTER_STORAGE_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    profiles: [app]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres-data:
  object-storage-data:
