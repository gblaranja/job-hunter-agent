# Serve o SPA e repassa /api ao backend na mesma origem (sessão e CSRF sem CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Currículos até 5 MB e PDF da página até 10 MB, com folga para o multipart.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
