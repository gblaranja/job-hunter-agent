# Valores de desenvolvimento local; em produção tudo vem das variáveis de ambiente.
jobhunter:
  security:
    username: ${JOBHUNTER_USER:admin}
    # senha "jobhunter"
    password-hash: ${JOBHUNTER_PASSWORD_HASH:{bcrypt}$2a$10$iIYdsL/jCnchsQCSW.ZeyeHVFnFAsE7dUEwoDOzetJ4ydIl8v466m}
    google:
      after-login-url: ${JOBHUNTER_AFTER_LOGIN_URL:http://localhost:5173/board}
      login-url: ${JOBHUNTER_LOGIN_URL:http://localhost:5173/login}
  storage:
    endpoint: ${JOBHUNTER_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${JOBHUNTER_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${JOBHUNTER_STORAGE_ACCESS_KEY:jobhunter}
    secret-key: ${JOBHUNTER_STORAGE_SECRET_KEY:jobhunter-secret}
    create-bucket-if-missing: ${JOBHUNTER_STORAGE_CREATE_BUCKET:true}
  encryption:
    key: ${JOBHUNTER_ENCRYPTION_KEY:dev-only-encryption-key}
    salt: ${JOBHUNTER_ENCRYPTION_SALT:5c0744940b5c369b}
  gmail:
    after-connect-url: ${JOBHUNTER_GMAIL_AFTER_CONNECT_URL:http://localhost:5173/settings}
